<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resumen de la flota</title>
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pdfmake.min.js"></script>
<script src="vfs_fonts.js"></script>
<style>
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--gris-borde); padding: 6px 8px; vertical-align: top; font-size: 13px; }
  th { background-color: var(--azul-marino); color: var(--blanco); position: sticky; top: 0; }
  .celda-categoria { font-weight: 600; background: #f4f8fb; white-space: nowrap; }
  .item-linea { padding: 2px 4px; margin-bottom: 2px; border-radius: 3px; }
  .item-rojo { background-color: #F8D7DA; }
  .item-amarillo { background-color: #FFF176; }
  .tabla-scroll { overflow-x: auto; }
</style>
</head>
<body>
  <div class="barra-superior">
    <h1>Resumen de la flota</h1>
    <div>
      <button onclick="generarPDF()">Descargar PDF</button>
      <button onclick="window.location.href='panel.html'">← Panel</button>
    </div>
  </div>
  <div class="contenedor" style="max-width: none;">
  <div class="tarjeta tabla-scroll">
    <table id="tablaResumen"></table>
  </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pfyvliaknlpuawuppsko.supabase.co";
    const SUPABASE_KEY = "sb_publishable_f3F70B-1EnU3aRpQaFu7_A_szShexxl";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const UMBRAL_DIAS = 90;
    let categorias = [];
    let helicopteros = [];
    let mapaItems = {};

    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";
      const [anio, mes, dia] = fechaISO.split("-");
      return `${dia}/${mes}/${anio}`;
    }

    function estadoItem(item) {
      if (!item.caduca || !item.fecha_caducidad) return "";
      const hoy = new Date().toISOString().split("T")[0];
      const dias = Math.floor((new Date(item.fecha_caducidad) - new Date(hoy)) / (1000 * 60 * 60 * 24));
      if (dias < 0) return "rojo";
      if (dias <= UMBRAL_DIAS) return "amarillo";
      return "";
    }

    async function obtenerDatos() {
      const { data: cats } = await client.from("categorias_producto").select("id, nombre").order("orden");
      categorias = cats;

      const { data: helis } = await client.from("helicopteros").select("id, nombre").order("nombre");
      helicopteros = helis;

      const { data: botiquines } = await client.from("botiquines").select("id, helicoptero_id");
      const mapaBotiquines = Object.fromEntries(botiquines.map(b => [b.id, b.helicoptero_id]));

      const { data: items } = await client.from("items").select("*").eq("estado", "activo");

      mapaItems = {};
      items.forEach(item => {
        const helicopteroId = mapaBotiquines[item.botiquin_id];
        if (!helicopteroId) return;
        const clave = item.categoria_id + "|" + helicopteroId;
        if (!mapaItems[clave]) mapaItems[clave] = [];
        mapaItems[clave].push(item);
      });
    }

    function textoItem(item) {
      const producto = [item.marca, item.modelo].filter(Boolean).join(" ");
      const cantidadTxt = `(${item.cantidad} u)`;
      const fechaTxt = item.caduca ? " - " + formatearFecha(item.fecha_caducidad) : "";
      return `${producto} ${cantidadTxt}${fechaTxt}`;
    }

    function renderTablaHTML() {
      const tabla = document.getElementById("tablaResumen");
      tabla.innerHTML = "";

      const thead = document.createElement("thead");
      const trCab = document.createElement("tr");
      trCab.innerHTML = "<th>Categoría</th>" + helicopteros.map(h => `<th>${h.nombre}</th>`).join("");
      thead.appendChild(trCab);
      tabla.appendChild(thead);

      const tbody = document.createElement("tbody");
      categorias.forEach(cat => {
        const tr = document.createElement("tr");
        let fila = `<td class="celda-categoria">${cat.nombre}</td>`;

        helicopteros.forEach(h => {
          const items = mapaItems[cat.id + "|" + h.id] || [];
          if (items.length === 0) {
            fila += "<td></td>";
          } else {
            const lineas = items.map(item => {
              const estado = estadoItem(item);
              const clase = estado === "rojo" ? "item-rojo" : (estado === "amarillo" ? "item-amarillo" : "");
              return `<div class="item-linea ${clase}">${textoItem(item)}</div>`;
            }).join("");
            fila += `<td>${lineas}</td>`;
          }
        });

        tr.innerHTML = fila;
        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
    }

    function generarPDF() {
      const anchoCols = ["auto"].concat(helicopteros.map(() => "*"));

      const filaCabecera = [{ text: "Categoría", bold: true, fillColor: "#0B2E4F", color: "white" }]
        .concat(helicopteros.map(h => ({ text: h.nombre, bold: true, fillColor: "#0B2E4F", color: "white" })));

      const cuerpo = [filaCabecera];

      categorias.forEach(cat => {
        const fila = [{ text: cat.nombre, bold: true }];

        helicopteros.forEach(h => {
          const items = mapaItems[cat.id + "|" + h.id] || [];
          if (items.length === 0) {
            fila.push({ text: "" });
            return;
          }

          const spans = [];
          items.forEach((item, i) => {
            const estado = estadoItem(item);
            const color = estado === "rojo" ? "#F8D7DA" : (estado === "amarillo" ? "#FFF176" : undefined);
            spans.push({ text: textoItem(item) + (i < items.length - 1 ? "\n" : ""), fillColor: color });
          });
          fila.push({ text: spans });
        });

        cuerpo.push(fila);
      });

      const docDefinition = {
        pageOrientation: "landscape",
        pageMargins: [20, 20, 20, 20],
        content: [
          { text: "Resumen de la flota - Botiquines", fontSize: 14, bold: true, margin: [0, 0, 0, 10] },
          { table: { headerRows: 1, widths: anchoCols, body: cuerpo } }
        ],
        defaultStyle: { fontSize: 7 }
      };

      pdfMake.createPdf(docDefinition).download("Resumen_flota_botiquines.pdf");
    }

    async function iniciar() {
      await obtenerDatos();
      renderTablaHTML();
    }

    iniciar();
  </script>
</body>
</html>
