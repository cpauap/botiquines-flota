    let categorias = [], unidades = [];

    function base64ToUint8(b64) {
      const binario = atob(b64);
      const bytes = new Uint8Array(binario.length);
      for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
      return bytes;
    }

    function formatearFechaCorta(fechaISO) {
      const [a, m, d] = fechaISO.split("-");
      return { d, m, a };
    }

    async function cargarDatos() {
      const { data: cats } = await client.from("categorias_material").select("id, nombre").order("orden");
      categorias = cats;

      const { data: bs } = await client.from("bases").select("id, nombre").order("nombre");
      const selectDestino = document.getElementById("baseDestino");
      selectDestino.innerHTML = "";
      bs.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.id; opt.innerText = b.nombre;
        selectDestino.appendChild(opt);
      });

      document.getElementById("fechaEntrega").value = new Date().toISOString().split("T")[0];

      const { data: us } = await client.from("material_seguridad").select("*").eq("estado", "activo");
      unidades = us || [];

      const mapaBases = Object.fromEntries(bs.map(b => [b.id, b.nombre]));
      const contenedor = document.getElementById("listaSeleccion");
      contenedor.innerHTML = "";

      categorias.forEach(cat => {
        const delGrupo = unidades.filter(u => u.categoria_id === cat.id);
        if (delGrupo.length === 0) return;

        const bloque = document.createElement("div");
        bloque.className = "categoria-bloque";
        bloque.innerHTML = `<div class="categoria-titulo">${cat.nombre}</div>`;

        delGrupo.forEach(u => {
          const fila = document.createElement("div");
          fila.className = "fila-check";
          fila.innerHTML = `<label><input type="checkbox" value="${u.id}" class="check-unidad"> ${u.nombre ? u.nombre + " - " : ""}${u.marca} ${u.modelo || ""} (S/N ${u.numero_serie || "-"}) &mdash; actualmente en ${mapaBases[u.base_id] || ""}</label>`;
          bloque.appendChild(fila);
        });

        contenedor.appendChild(bloque);
      });
    }

    async function generarActa() {
      const seleccionados = Array.from(document.querySelectorAll(".check-unidad:checked")).map(c => c.value);
      if (seleccionados.length === 0) { alert("Selecciona al menos un objeto."); return; }

      const baseDestinoId = document.getElementById("baseDestino").value;
      const baseDestinoNombre = document.getElementById("baseDestino").selectedOptions[0].innerText;
      const fecha = document.getElementById("fechaEntrega").value;
      if (!fecha) { alert("Elige una fecha."); return; }
      const { d, m, a } = formatearFechaCorta(fecha);

      const { Document, Packer, Table, TableRow, TableCell, Paragraph, TextRun, ImageRun,
              WidthType, ShadingType, AlignmentType, VerticalAlign, BorderStyle } = docx;

      const mapaCategorias = Object.fromEntries(categorias.map(c => [c.id, c.nombre]));

      const bordeFino = { style: BorderStyle.SINGLE, size: 4, color: "000000" };
      const bordes = { top: bordeFino, bottom: bordeFino, left: bordeFino, right: bordeFino };

      function celda(texto, opciones = {}) {
        return new TableCell({
          borders: bordes,
          verticalAlign: VerticalAlign.CENTER,
          rowSpan: opciones.rowSpan || 1,
          margins: { top: 120, bottom: 120, left: 150, right: 150 },
          children: [new Paragraph({
            alignment: opciones.centrado ? AlignmentType.CENTER : AlignmentType.LEFT,
            children: [new TextRun({ text: texto || "", bold: opciones.bold || false, size: 24 })]
          })]
        });
      }

      // Agrupar los seleccionados por categoría
      const gruposPorCategoria = {};
      seleccionados.forEach(id => {
        const u = unidades.find(x => x.id === id);
        if (!gruposPorCategoria[u.categoria_id]) gruposPorCategoria[u.categoria_id] = [];
        gruposPorCategoria[u.categoria_id].push(u);
      });

      const filasTabla = [];
      Object.entries(gruposPorCategoria).forEach(([categoriaId, lista]) => {
        const nombreCat = (mapaCategorias[categoriaId] || "").toUpperCase();
        const necesitaS = lista.length > 1 && !nombreCat.endsWith("S");
        const etiqueta = lista.length + " " + nombreCat + (necesitaS ? "S" : "");

        filasTabla.push(new TableRow({ children: [
          celda(etiqueta, { bold: true, rowSpan: lista.length + 1 }),
          celda("MODELO", { bold: true }),
          celda("P/N", { bold: true }),
          celda("S/N", { bold: true })
        ]}));

        lista.forEach(u => {
          filasTabla.push(new TableRow({ children: [
            celda(u.marca + (u.modelo ? " " + u.modelo : "")),
            celda(u.modelo || ""),
            celda(u.numero_serie || "")
          ]}));
        });
      });

      const tablaItems = new Table({
        width: { size: 9500, type: WidthType.DXA },
        columnWidths: [2800, 2800, 2000, 1900],
        rows: filasTabla
      });

      const filaLogo = new TableRow({ children: [
        new TableCell({
          width: { size: 3000, type: WidthType.DXA },
          verticalAlign: VerticalAlign.CENTER,
          children: [new Paragraph({ alignment: AlignmentType.CENTER, children: [
            new ImageRun({ data: base64ToUint8(IMG_LOGO), transformation: { width: 130, height: 81 } })
          ]})]
        }),
        new TableCell({
          width: { size: 6000, type: WidthType.DXA },
          shading: { type: ShadingType.CLEAR, fill: "182E4D" },
          verticalAlign: VerticalAlign.CENTER,
          children: [
            new Paragraph({ children: [new TextRun({ text: "DIVISIÓN DE OPERACIONES Y TRANSFORMACIÓN DIGITAL", bold: true, color: "FFFFFF" })] }),
            new Paragraph({ text: "" }),
            new Paragraph({ children: [new TextRun({ text: "UNIDAD AÉREA DE LA POLICÍA GRUPO SEGURIDAD VUELO", bold: true, color: "FFFFFF" })] }),
            new Paragraph({ text: "" }),
            new Paragraph({ children: [new TextRun({ text: "Aeropuerto Madrid-Cuatro Vientos", color: "FFFFFF" })] }),
            new Paragraph({ children: [new TextRun({ text: "28054-Madrid", color: "FFFFFF" })] }),
            new Paragraph({ children: [new TextRun({ text: "Tfno.: 91 582 1172", color: "FFFFFF" })] }),
            new Paragraph({ children: [new TextRun({ text: "dotd.mediosaereossvuelo@policia.es", color: "FFFFFF" })] })
          ]
        })
      ]});

      const tablaMembrete = new Table({ width: { size: 9000, type: WidthType.DXA }, rows: [filaLogo] });

      const iconosRun = IMG_ICONOS.map(b => new ImageRun({ data: base64ToUint8(b), transformation: { width: 14, height: 14 } }));

      const doc = new Document({
        sections: [{
          properties: { page: { margin: { top: 720, bottom: 720, left: 700, right: 700 } } },
          children: [
            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "RELACIÓN DE MATERIAL DE SUPERVIVENCIA PARA ENVIAR A " + baseDestinoNombre.toUpperCase(), bold: true, size: 28 })] }),
            new Paragraph({ text: "" }),
            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: `(ENTREGADO EN ${baseDestinoNombre.toUpperCase()} EL ${d}/${m}/${a})`, size: 24 })] }),
            new Paragraph({ text: "" }),
            tablaItems,
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            new Paragraph({ text: "" }),
            tablaMembrete,
            new Paragraph({
              alignment: AlignmentType.CENTER,
              children: [
                ...iconosRun,
                new TextRun({ text: "  " }),
                new ImageRun({ data: base64ToUint8(IMG_091), transformation: { width: 32, height: 14 } }),
                new TextRun({ text: "  " }),
                new ImageRun({ data: base64ToUint8(IMG_POLICIA), transformation: { width: 54, height: 14 } })
              ]
            })
          ]
        }]
      });

      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement("a");
      a2.href = url;
      a2.download = `Acta_${baseDestinoNombre}_${fecha}.docx`;
      a2.click();
    }

    cargarDatos();
  </script>
