<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha del objeto</title>
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .nota { border-bottom: 1px solid var(--gris-borde); padding: 8px 0; }
  .nota textarea { width: 100%; }
  .nota-meta { font-size: 12px; color: #666; }
</style>
</head>
<body>
  <div class="barra-superior">
    <h1 id="titulo">Cargando...</h1>
    <button onclick="volver()">← Volver</button>
  </div>
  <div class="contenedor">

  <div class="tarjeta" id="datosBasicos">Cargando datos...</div>

  <div class="tarjeta">
    <h3>Historial de ubicaciones</h3>
    <table>
      <thead><tr><th>Fecha</th><th>De</th><th>A</th></tr></thead>
      <tbody id="filasHistorialUbicacion"></tbody>
    </table>
  </div>

  <div class="tarjeta">
    <h3>Observaciones</h3>
    <div id="listaNotas"></div>
    <textarea id="notaNueva" rows="2" style="width:100%;" placeholder="Añadir una observación..."></textarea>
    <button onclick="añadirNota()">Añadir observación</button>
  </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pfyvliaknlpuawuppsko.supabase.co";
    const SUPABASE_KEY = "sb_publishable_f3F70B-1EnU3aRpQaFu7_A_szShexxl";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const materialId = params.get("id");
    let mapaBases = {};
    let mapaCategorias = {};

    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";
      const [anio, mes, dia] = fechaISO.split("-");
      return `${dia}/${mes}/${anio}`;
    }

    function formatearFechaHora(iso) {
      const d = new Date(iso);
      return d.toLocaleString("es-ES");
    }

    function volver() {
      window.location.href = "material.html";
    }

    async function cargarMapas() {
      const { data: bases } = await client.from("bases").select("id, nombre");
      bases.forEach(b => { mapaBases[b.id] = b.nombre; });
      const { data: categorias } = await client.from("categorias_material").select("id, nombre");
      categorias.forEach(c => { mapaCategorias[c.id] = c.nombre; });
    }

    async function cargarDatos() {
      await cargarMapas();

      const { data: u } = await client.from("material_seguridad").select("*").eq("id", materialId).single();

      document.getElementById("titulo").innerText = `${mapaCategorias[u.categoria_id] || ""} - ${u.marca}`;
      document.getElementById("datosBasicos").innerHTML = `
        <p><b>Categoría:</b> ${mapaCategorias[u.categoria_id] || ""}</p>
        <p><b>Marca:</b> ${u.marca} &nbsp; <b>Modelo:</b> ${u.modelo || ""}</p>
        <p><b>Nº de serie:</b> ${u.numero_serie || ""}</p>
        <p><b>Base actual:</b> ${mapaBases[u.base_id] || ""}</p>
        <p><b>Caducidad:</b> ${formatearFecha(u.fecha_caducidad)} &nbsp; <b>Revisión:</b> ${formatearFecha(u.fecha_revision)}</p>
        <p><b>Estado:</b> ${u.estado}</p>
      `;

      cargarHistorialUbicacion();
      cargarNotas();
    }

    async function cargarHistorialUbicacion() {
      const { data: logs } = await client
        .from("audit_log")
        .select("*")
        .eq("tabla", "material_seguridad")
        .eq("registro_id", materialId)
        .order("creado_en", { ascending: true });

      const filas = document.getElementById("filasHistorialUbicacion");
      filas.innerHTML = "";

      logs.forEach(l => {
        const antes = l.datos_anteriores?.base_id;
        const despues = l.datos_nuevos?.base_id;

        if (l.accion === "insert") {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${formatearFechaHora(l.creado_en)}</td><td>—</td><td>${mapaBases[despues] || ""}</td>`;
          filas.appendChild(tr);
        } else if (antes && despues && antes !== despues) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${formatearFechaHora(l.creado_en)}</td><td>${mapaBases[antes] || ""}</td><td>${mapaBases[despues] || ""}</td>`;
          filas.appendChild(tr);
        }
      });

      if (filas.children.length === 0) {
        filas.innerHTML = "<tr><td colspan='3'>Sin cambios de ubicación registrados.</td></tr>";
      }
    }

    async function cargarNotas() {
      const { data: notas } = await client
        .from("notas_material")
        .select("*")
        .eq("material_id", materialId)
        .order("creado_en", { ascending: false });

      const contenedor = document.getElementById("listaNotas");
      contenedor.innerHTML = "";

      notas.forEach(n => {
        const div = document.createElement("div");
        div.className = "nota";
        div.innerHTML = `
          <textarea id="nota-${n.id}" rows="2" style="width:100%;">${n.texto}</textarea>
          <div class="nota-meta">
            Creada: ${formatearFechaHora(n.creado_en)}${n.actualizado_en ? " · Editada: " + formatearFechaHora(n.actualizado_en) : ""}
          </div>
          <button onclick="guardarEdicionNota('${n.id}')">Guardar cambios</button>
        `;
        contenedor.appendChild(div);
      });
    }

    async function añadirNota() {
      const texto = document.getElementById("notaNueva").value;
      if (!texto) return;

      const { data: sesion } = await client.auth.getSession();

      await client.from("notas_material").insert({
        material_id: materialId,
        texto,
        creado_por: sesion.session.user.id
      });

      document.getElementById("notaNueva").value = "";
      cargarNotas();
    }

    async function guardarEdicionNota(id) {
      const texto = document.getElementById("nota-" + id).value;
      await client.from("notas_material")
        .update({ texto, actualizado_en: new Date().toISOString() })
        .eq("id", id);
      cargarNotas();
    }

    cargarDatos();
  </script>
</body>
</html>
